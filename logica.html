<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIX — Batalla de Proposiciones</title>

<style>

:root{
  --bg:#0a0a0f;
  --surface:#13131f;
  --card:#1a1a2e;
  --border:#2a2a4a;
  --true:#00e5a0;
  --false:#ff3e6c;
  --neutral:#7b7bff;
  --gold:#ffd700;
  --text:#e8e8ff;
  --muted:#6666aa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial;
  min-height:100vh;
}

.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

.center{
  text-align:center;
}

.logo{
  font-size:60px;
  color:var(--neutral);
  margin-top:40px;
  margin-bottom:20px;
}

.btn{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:5px;
  font-size:16px;
}

.btn-primary{
  background:var(--neutral);
  color:white;
}

.btn-danger{
  background:var(--false);
  color:white;
}

.btn-success{
  background:var(--true);
  color:black;
}

.game{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:20px;
}

.panel{
  background:var(--surface);
  padding:20px;
  border-radius:10px;
  border:1px solid var(--border);
}

.hp-bar{
  width:100%;
  height:20px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.hp-fill{
  height:100%;
  background:lime;
  width:100%;
  transition:0.3s;
}

.formula-box{
  background:black;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
  min-height:50px;
  font-size:24px;
}

.buttons{
  margin-top:15px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.symbol-btn{
  padding:10px 15px;
  font-size:20px;
  cursor:pointer;
}

.log{
  margin-top:20px;
  max-height:250px;
  overflow:auto;
}

.log div{
  background:#111;
  margin-bottom:8px;
  padding:8px;
  border-radius:5px;
}

.truth{
  color:var(--true);
}

.false{
  color:var(--false);
}

</style>
</head>

<body>

<div id="screen-menu" class="screen active center">

  <h1 class="logo">LOGIX</h1>

  <p style="margin-bottom:20px;">
    Batalla lógica de proposiciones
  </p>

  <button class="btn btn-primary" onclick="startGame()">
    COMENZAR PARTIDA
  </button>

</div>

<div id="screen-game" class="screen">

  <div class="game">

    <div>

      <div class="panel">

        <h2 id="turnText">
          Turno Jugador 1
        </h2>

        <br>

        <h3>Jugador actual</h3>

        <div id="myProps"></div>

        <div class="hp-bar">
          <div id="myHp" class="hp-fill"></div>
        </div>

        <br>

        <h3>Rival</h3>

        <div id="enemyProps"></div>

        <div class="hp-bar">
          <div id="enemyHp" class="hp-fill"></div>
        </div>

      </div>

      <div class="panel" style="margin-top:20px;">

        <h3>Fórmula</h3>

        <div id="formula" class="formula-box">
          _
        </div>

        <div class="buttons">

          <button class="symbol-btn" onclick="addSymbol('p')">p</button>
          <button class="symbol-btn" onclick="addSymbol('q')">q</button>
          <button class="symbol-btn" onclick="addSymbol('r')">r</button>

          <button class="symbol-btn" onclick="addSymbol('¬')">¬</button>
          <button class="symbol-btn" onclick="addSymbol('∧')">∧</button>
          <button class="symbol-btn" onclick="addSymbol('∨')">∨</button>
          <button class="symbol-btn" onclick="addSymbol('→')">→</button>
          <button class="symbol-btn" onclick="addSymbol('↔')">↔</button>

          <button class="symbol-btn" onclick="addSymbol('(')">(</button>
          <button class="symbol-btn" onclick="addSymbol(')')">)</button>

          <button class="symbol-btn" onclick="removeSymbol()">⌫</button>

          <button class="symbol-btn" onclick="clearFormula()">C</button>

        </div>

        <br>

        <button class="btn btn-danger" onclick="attack()">
          ATACAR
        </button>

        <button class="btn btn-success" onclick="defend()">
          DEFENDER
        </button>

        <button class="btn btn-primary" onclick="deduce()">
          DEDUCIR
        </button>

      </div>

    </div>

    <div class="panel">

      <h3>Registro</h3>

      <div id="log" class="log"></div>

    </div>

  </div>

</div>

<script>

let game = {

  currentPlayer:0,

  formula:'',

  players:[

    {
      hp:100,
      shield:false,
      props:{
        p:Math.random()>0.5,
        q:Math.random()>0.5,
        r:Math.random()>0.5
      },
      revealed:{
        p:false,
        q:false,
        r:false
      }
    },

    {
      hp:100,
      shield:false,
      props:{
        p:Math.random()>0.5,
        q:Math.random()>0.5,
        r:Math.random()>0.5
      },
      revealed:{
        p:false,
        q:false,
        r:false
      }
    }

  ]

};

function startGame(){

  showScreen('screen-game');

  render();

}

function showScreen(id){

  document.querySelectorAll('.screen')
  .forEach(s=>s.classList.remove('active'));

  document.getElementById(id)
  .classList.add('active');
}

function render(){

  const me = game.players[game.currentPlayer];

  const enemy =
  game.players[1-game.currentPlayer];

  document.getElementById('turnText')
  .innerText =
  'Turno Jugador ' + (game.currentPlayer+1);

  document.getElementById('formula')
  .innerText =
  game.formula || '_';

  document.getElementById('myHp')
  .style.width =
  me.hp + '%';

  document.getElementById('enemyHp')
  .style.width =
  enemy.hp + '%';

  document.getElementById('myProps')
  .innerHTML =
  `
  p=${me.props.p?'V':'F'}<br>
  q=${me.props.q?'V':'F'}<br>
  r=${me.props.r?'V':'F'}
  `;

  let txt='';

  ['p','q','r'].forEach(prop=>{

    if(enemy.revealed[prop]){

      txt +=
      `${prop}=${enemy.props[prop]?'V':'F'}<br>`;

    }else{

      txt += `${prop}=?<br>`;
    }

  });

  document.getElementById('enemyProps')
  .innerHTML = txt;
}

function addSymbol(s){

  game.formula += s;

  render();
}

function removeSymbol(){

  game.formula =
  game.formula.slice(0,-1);

  render();
}

function clearFormula(){

  game.formula='';

  render();
}

function tokenize(str){

  return str.replace(/\s/g,'').split('');
}

function parseFormula(formula, vals){

  const tokens = tokenize(formula);

  let pos = 0;

  function peek(){
    return tokens[pos];
  }

  function consume(){
    return tokens[pos++];
  }

  function primary(){

    let t = peek();

    if(t==='('){

      consume();

      let val = biconditional();

      consume();

      return val;
    }

    if(t==='p'){
      consume();
      return vals.p;
    }

    if(t==='q'){
      consume();
      return vals.q;
    }

    if(t==='r'){
      consume();
      return vals.r;
    }

    throw 'error';
  }

  function negation(){

    if(peek()==='¬'){

      consume();

      return !negation();
    }

    return primary();
  }

  function conjunction(){

    let left = negation();

    while(peek()==='∧'){

      consume();

      left =
      left && negation();
    }

    return left;
  }

  function disjunction(){

    let left = conjunction();

    while(peek()==='∨'){

      consume();

      left =
      left || conjunction();
    }

    return left;
  }

  function implication(){

    let left = disjunction();

    while(peek()==='→'){

      consume();

      left =
      (!left || disjunction());
    }

    return left;
  }

  function biconditional(){

    let left = implication();

    while(peek()==='↔'){

      consume();

      left =
      left === implication();
    }

    return left;
  }

  return biconditional();
}

function attack(){

  if(game.formula===''){
    alert('Construye una fórmula');
    return;
  }

  const me =
  game.players[game.currentPlayer];

  const enemy =
  game.players[1-game.currentPlayer];

  try{

    const result =
    parseFormula(
      game.formula,
      enemy.props
    );

    if(result){

      let damage = 20;

      if(enemy.shield){

        damage = 10;

        enemy.shield=false;
      }

      enemy.hp -= damage;

      addLog(
        `Ataque verdadero: -${damage} HP`,
        true
      );

    }else{

      me.hp -= 10;

      addLog(
        `Ataque falso: pierdes 10 HP`,
        false
      );
    }

  }catch{

    alert('Fórmula inválida');

    return;
  }

  endTurn();
}

function defend(){

  if(game.formula===''){
    alert('Construye una fórmula');
    return;
  }

  const me =
  game.players[game.currentPlayer];

  try{

    const result =
    parseFormula(
      game.formula,
      me.props
    );

    if(result){

      me.shield=true;

      addLog(
        'Escudo activado',
        true
      );

    }else{

      addLog(
        'Defensa fallida',
        false
      );
    }

  }catch{

    alert('Fórmula inválida');

    return;
  }

  endTurn();
}

function deduce(){

  const enemy =
  game.players[1-game.currentPlayer];

  const props=['p','q','r'];

  const hidden =
  props.filter(p=>!enemy.revealed[p]);

  if(hidden.length===0){

    alert('Todo revelado');

    return;
  }

  const prop =
  hidden[Math.floor(Math.random()*hidden.length)];

  enemy.revealed[prop]=true;

  alert(
    prop +
    ' = ' +
    (enemy.props[prop]?'VERDADERO':'FALSO')
  );

  addLog(
    `Revelado ${prop}`,
    true
  );

  endTurn();
}

function addLog(text, ok){

  const div =
  document.createElement('div');

  div.className =
  ok ? 'truth' : 'false';

  div.innerText = text;

  document.getElementById('log')
  .prepend(div);
}

function endTurn(){

  game.formula='';

  if(game.players[0].hp<=0){

    alert('Jugador 2 gana');

    location.reload();

    return;
  }

  if(game.players[1].hp<=0){

    alert('Jugador 1 gana');

    location.reload();

    return;
  }

  game.currentPlayer =
  1-game.currentPlayer;

  render();
}

</script>

</body>
</html>
